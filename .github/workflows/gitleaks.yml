name: gitleaks

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * 1' # weekly full-history sweep, Mondays 04:00 UTC

permissions:
  contents: read
  pull-requests: read # gitleaks-action enumerates the PR's commits on pull_request events

jobs:
  scan:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history so the scan covers every commit
          persist-credentials: false
      # A pull request is scanned with the base branch's rules, so it cannot loosen them for itself.
      - name: Scanner rules from the base branch
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git show "$BASE_SHA:.gitleaks.toml" > "$RUNNER_TEMP/gitleaks.toml"
          echo "GITLEAKS_CONFIG=$RUNNER_TEMP/gitleaks.toml" >> "$GITHUB_ENV"
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
