name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # nothing here pushes; a pull request's code must not find a token on disk
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
          cache: pip
      - run: pip install --require-hashes -r requirements.txt

      # The gate on a staging copy: build and export the art here, the frozen check, the loop test, the quote rule,
      # then the Java renderer against the frames this machine's Python drew.
      - name: Gate (staging copy)
        run: STAGE_ONLY=1 bash dev/merge_poses.sh

      - name: Date rules and baked gradients
        run: |
          python3 -I -B dev/check_dates.py | tail -1 | tee /dev/stderr | grep -q "RESULT: every check passed"
          python3 -I -B dev/fs_check.py --selftest | tail -1 | tee /dev/stderr | grep -q "RESULT: sky, sea and sand are baked"

      # The committed art: the Java renderer against the committed reference hashes, lint, and the APK.
      - name: Unit tests, lint and the release build
        run: ./gradlew --no-daemon -q testReleaseUnitTest lintRelease assembleRelease
      - name: The APK holds the art folder
        run: python3 -I dev/apk_check.py app/build/outputs/apk/release/app-release.apk art
